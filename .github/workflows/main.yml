name: Remote SSH Command
on:
  push:
    branches:
      # - main
      - main
      # - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.SSH_HOST}}
          username: ${{secrets.SSH_USER}}
          password: ${{secrets.SSH_PASSWORD}}
          port: ${{secrets.SSH_PORT}}
          script: |
            cd ${{secrets.WORK_DIR}}
            git config --global --add safe.directory ${{secrets.WORK_DIR}}
            git reset --hard HEAD
            git clean -fd
            git checkout ${{secrets.MAIN_BRANCH}}
            git pull origin ${{secrets.MAIN_BRANCH}}
            
            # 1. S'assurer que l'utilisateur est propriétaire du dossier avant d'installer/build
            sudo chown -R $USER:$USER .
            
            npm install
            
            # 2. Supprimer l'ancien dossier build s'il existe pour repartir de zéro
            rm -rf build/
            
            npm run build
            echo "Deployed successfully at $(date)" >> deploy.log
