name: Remote SSH Command
on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.SSH_HOST}}
          username: ${{secrets.SSH_USER}}
          password: ${{secrets.SSH_PASSWORD}}
          port: ${{secrets.SSH_PORT}}
          script: |
            cd ${{secrets.WORK_DIR}}
            # On passe le mot de passe à sudo pour donner les droits d'écriture au dossier
            echo "${{secrets.SSH_PASSWORD}}" | sudo -S chown -R $USER:$USER ${{secrets.WORK_DIR}}
            
            git config --global --add safe.directory ${{secrets.WORK_DIR}}
            git reset --hard HEAD
            git clean -fd
            git checkout ${{secrets.MAIN_BRANCH}}
            git pull origin ${{secrets.MAIN_BRANCH}}
            
            npm install
            
            # On s'assure que le dossier build est supprimé proprement avant de reconstruire
            echo "${{secrets.SSH_PASSWORD}}" | sudo -S rm -rf build/
            
            npm run build
            echo "Deployed successfully at $(date)" >> deploy.log
